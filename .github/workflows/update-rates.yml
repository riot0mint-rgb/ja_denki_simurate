name: 燃調の月次取り込み

# 燃調は毎月改定される。月初に取りに行き、差分があれば PR を立てる。
on:
  schedule:
    - cron: "0 1 3 * *"   # 毎月 3 日 10:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 差分を取り込む
        id: update
        run: |
          set +e
          python3 scripts/update_rates.py --apply | tee report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: 変更の有無を判定
        id: changed
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: テストが通ることを確認
        if: steps.changed.outputs.changed == 'true'
        run: python -m pip install -e ".[dev]" && python -m pytest

      - name: PR を立てる
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="rates/fuel-adjustment-$(date +%Y%m)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "燃料費調整額を更新（$(date +%Y-%m)）"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "燃料費調整額を更新（$(date +%Y-%m)）" \
            --body "$(printf '中国電力サイトから取り込んだ差分です。\n\n```\n%s\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$(cat report.txt)")" \
            --base main --draft

      # 終了コード 2 = 既存の月の値が変わっていた。取得元の訂正か取り違えなので人が見る。
      - name: 既存の月が変わっていたら失敗させる
        if: steps.update.outputs.exit_code == '2'
        run: |
          echo "::error::過去分の燃調が変わっています。取得元の訂正か取り違えを確認してください。"
          exit 1
