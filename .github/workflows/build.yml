name: Build and Test

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build calc-core
        run: npm run build -w @ja-denki-simulator/calc-core

      # calc-core 100% / Web UI 80% / scripts 100% を閾値に設定してある。
      # npm test だけでは閾値未達を検知できず、実際に 88% まで落ちていた。
      - name: Run tests with coverage (calc-core 100% / web 80% / scripts 100%)
        run: npm run test:coverage

      - name: Type check
        run: npm run type-check

      # 料金マスターJSONは rates.ts からの生成物。手編集や更新漏れをここで落とす。
      - name: Verify rate master is in sync
        run: npm run rate-master:check

      - name: Build web application
        run: npm run build -w @ja-denki-simulator/web

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/dist/
          retention-days: 7

  verify-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi
          if [ ! -d "assets" ]; then
            echo "ERROR: assets directory not found"
            exit 1
          fi
          echo "✓ Build output verified"

      - name: Check file sizes
        run: |
          echo "Build artifact sizes:"
          find . -type f -exec ls -lh {} \;
