[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ja-denki"
version = "0.2.0"
description = "JAでんき 料金シミュレータ（中国電力エリア・低圧家庭用）"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ja-denki = "ja_denki.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
